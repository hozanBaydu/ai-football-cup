      function introFinal(t) { // semi results, then the two winners move into the final

      function trophy(x, y, s) { // simple gold cup

        g.beginPath(); g.moveTo(-70, -80); g.lineTo(70, -80); g.quadraticCurveTo(68, 20, 0, 40); g.quadraticCurveTo(-68, 20, -70, -80); g.fill(); g.stroke();
